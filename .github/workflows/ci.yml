name: ci

on:
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened]
  # The release PR (develop → master) is opened with GITHUB_TOKEN when no
  # RELEASE_TOKEN exists, and such PRs trigger no `pull_request` run. Running
  # on push to develop gives its head SHA a `ci ok` check anyway.
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_COLOR: '3'

jobs:
  commits:
    name: conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-pnpm

      # semantic-release tính version từ commit message, nên message sai format
      # = version sai. Với event `pull_request`, khoảng cần lint là base..head của PR.
      # `workflow_dispatch` không có hai SHA đó → rơi vào fallback merge-base.
      - name: Resolve commit range
        id: range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            FROM="$PR_BASE_SHA"; TO="$PR_HEAD_SHA"
          else
            FROM="$(git merge-base origin/develop HEAD 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            TO=HEAD
          fi
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "to=$TO" >> "$GITHUB_OUTPUT"
          echo "Lint commit trong khoảng $FROM..$TO"

      - name: Lint commit messages
        run: >-
          pnpm exec commitlint --verbose
          --from ${{ steps.range.outputs.from }}
          --to ${{ steps.range.outputs.to }}

      # Title của PR cũng phải hợp lệ: nếu repo dùng squash merge thì title trở
      # thành commit message trên develop/master.
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | pnpm exec commitlint --verbose

  static:
    name: lint + format + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-pnpm

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-pnpm

      # Script riêng (không truyền cờ qua `pnpm test --`) để tránh phụ thuộc
      # vào cách pnpm forward argument.
      - name: Test
        run: pnpm test:ci
        env:
          NODE_ENV: test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-pnpm

      - name: Build
        run: pnpm build

  audit:
    name: audit deps
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm
        with:
          install: 'false' # audit chỉ đọc pnpm-lock.yaml, không cần node_modules

      # Danh sách advisory được chấp nhận rủi ro (pnpm.auditConfig.ignoreGhsas trong
      # package.json) kèm lý do + ngày rà lại: docs/security-audit.md.
      #
      # CHẶN: chỉ trên nhánh production (thứ thật sự đi vào image) và chỉ từ high trở lên.
      # Nhánh dev (eslint/jest/commitlint/semantic-release) cố tình KHÔNG chặn — phần lớn
      # phải chờ upstream vá, chặn ở đó thì CI đỏ vĩnh viễn và người ta sẽ học cách phớt lờ.
      #
      # --ignore-registry-errors: registry advisory sập thì không chặn merge. Lưới an toàn
      # cho trường hợp đó là workflow audit-schedule.yml chạy hằng tuần.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high --ignore-registry-errors

      # BÁO CÁO: toàn bộ cây, không chặn. Bảng markdown ra job summary, đánh dấu rõ
      # advisory nào thuộc nhánh prod và advisory nào chỉ có ở dev.
      - name: Report full tree
        if: always()
        run: |
          pnpm audit --json --ignore-registry-errors > "$RUNNER_TEMP/audit-full.json" || true
          pnpm audit --prod --json --ignore-registry-errors > "$RUNNER_TEMP/audit-prod.json" || true
          node scripts/audit-summary.mjs "$RUNNER_TEMP/audit-full.json" "$RUNNER_TEMP/audit-prod.json" \
            >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e (webrtc)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-pnpm

      # Kết nối WebRTC thật giữa nhiều browser context (QR bootstrap, mesh qua
      # relay, Host migration, reload + rejoin). Chỉ cần Chromium.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Job tổng hợp duy nhất để đặt làm required status check trên branch protection —
  # thêm/bớt job phía trên không cần sửa lại setting của repo.
  ci-ok:
    name: ci ok
    if: always()
    needs: [commits, static, test, e2e, build, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify no job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Kết quả các job: $RESULTS"
          # CHỈ nhận `success`. Không nhận `skipped`: hiện không job nào có `if:`, nên
          # skipped là dấu hiệu có gì sai; và nếu sau này thêm `if:` vào một job thì phải
          # thấy nó đỏ ở đây chứ không được im lặng pass.
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::Có job kết thúc với trạng thái '$r'"
              exit 1
            fi
          done
